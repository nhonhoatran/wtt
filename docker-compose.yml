# Dokploy compose (staging and production use the same file; values come from each Dokploy project).
# Dokploy writes UI env vars to .env beside this file but does not inject them, so every variable is listed.
name: kamito-tt

x-common-env: &common-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV:?APP_ENV}
  TZ: ${TZ:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-backend-env: &backend-env
  <<: *common-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?REDIS_URL}
  QUEUE_PREFIX: ${QUEUE_PREFIX:?QUEUE_PREFIX}
  REDIS_EVICTION_CHECK_OVERRIDE: ${REDIS_EVICTION_CHECK_OVERRIDE:-}

x-storage-env: &storage-env
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_INCOMING_BUCKET: ${S3_INCOMING_BUCKET:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  UPLOAD_MAX_IMAGE_BYTES: ${UPLOAD_MAX_IMAGE_BYTES:?UPLOAD_MAX_IMAGE_BYTES}
  UPLOAD_ALLOWED_IMAGE_TYPES: ${UPLOAD_ALLOWED_IMAGE_TYPES:?UPLOAD_ALLOWED_IMAGE_TYPES}
  MEDIA_IMAGE_VARIANT_WIDTHS: ${MEDIA_IMAGE_VARIANT_WIDTHS:?MEDIA_IMAGE_VARIANT_WIDTHS}

services:
  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile, target: migrate }
    environment:
      DATABASE_URL: ${DATABASE_MIGRATE_URL:?DATABASE_MIGRATE_URL}
      MIGRATE_CONFIRM_TARGET: ${MIGRATE_CONFIRM_TARGET:?MIGRATE_CONFIRM_TARGET}
    restart: "no"
    networks: [internal]

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile, target: runtime }
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      <<: [*backend-env, *storage-env]
      API_PORT: 3000
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET}
      SSR_INTERNAL_SECRET: ${SSR_INTERNAL_SECRET:?SSR_INTERNAL_SECRET}
      IP_HASH_SALT: ${IP_HASH_SALT:?IP_HASH_SALT}
      CLIENT_INTERNAL_URL: ${CLIENT_INTERNAL_URL:-http://client:3000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:?ADMIN_PUBLIC_URL}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:?TRUST_PROXY_HOPS}
      IMPORT_MAX_FILE_BYTES: ${IMPORT_MAX_FILE_BYTES:?IMPORT_MAX_FILE_BYTES}
      IMPORT_MAX_UNZIPPED_BYTES: ${IMPORT_MAX_UNZIPPED_BYTES:?IMPORT_MAX_UNZIPPED_BYTES}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:?IMPORT_MAX_ROWS}
      PAGINATION_MAX_PAGE_SIZE: ${PAGINATION_MAX_PAGE_SIZE:-100}
      QUERY_MAX_LENGTH: ${QUERY_MAX_LENGTH:-100}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks: [internal]

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      <<: [*backend-env, *storage-env]
      WORKER_HEALTH_PORT: 3010
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-2}
      MEDIA_CLEANUP_INTERVAL_MINUTES: ${MEDIA_CLEANUP_INTERVAL_MINUTES:-15}
      IMPORT_MAX_FILE_BYTES: ${IMPORT_MAX_FILE_BYTES:?IMPORT_MAX_FILE_BYTES}
      IMPORT_MAX_UNZIPPED_BYTES: ${IMPORT_MAX_UNZIPPED_BYTES:?IMPORT_MAX_UNZIPPED_BYTES}
      IMPORT_MAX_ROWS: ${IMPORT_MAX_ROWS:?IMPORT_MAX_ROWS}
      IMPORT_WORKER_CONCURRENCY: ${IMPORT_WORKER_CONCURRENCY:-1}
      IMPORT_CLEANUP_INTERVAL_MINUTES: ${IMPORT_CLEANUP_INTERVAL_MINUTES:-60}
      RANKING_WORKER_CONCURRENCY: ${RANKING_WORKER_CONCURRENCY:-1}
      RANKING_DIRTY_SWEEP_INTERVAL_MINUTES: ${RANKING_DIRTY_SWEEP_INTERVAL_MINUTES:-10}
      CLIENT_INTERNAL_URL: ${CLIENT_INTERNAL_URL:-http://client:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET}
      REVALIDATE_TIMEOUT_MS: ${REVALIDATE_TIMEOUT_MS:-5000}
      REVALIDATE_WORKER_CONCURRENCY: ${REVALIDATE_WORKER_CONCURRENCY:-2}
      NODE_OPTIONS: --max-old-space-size=${WORKER_MAX_OLD_SPACE_MB:-384}
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks: [internal]

  client:
    build: { context: ., dockerfile: docker/client.Dockerfile }
    depends_on: [api]
    environment:
      <<: *common-env
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?REVALIDATE_SECRET}
      # Must equal host:port of the worker's CLIENT_INTERNAL_URL, else every revalidate call gets 404.
      REVALIDATE_ALLOWED_HOSTS: ${REVALIDATE_ALLOWED_HOSTS:-client:3000}
      SSR_INTERNAL_SECRET: ${SSR_INTERNAL_SECRET:?SSR_INTERNAL_SECRET}
      PUBLIC_REVALIDATE_SECONDS: ${PUBLIC_REVALIDATE_SECONDS:?PUBLIC_REVALIDATE_SECONDS}
      MATCHDAY_REVALIDATE_SECONDS: ${MATCHDAY_REVALIDATE_SECONDS:?MATCHDAY_REVALIDATE_SECONDS}
      API_FETCH_TIMEOUT_MS: ${API_FETCH_TIMEOUT_MS:-5000}
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks: [internal, dokploy-network]

  admin:
    build: { context: ., dockerfile: docker/admin.Dockerfile }
    depends_on: [api]
    environment:
      API_BASE_PATH: ${API_BASE_PATH:-/api/v1}
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:?ADMIN_PUBLIC_URL}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL}
      UPLOAD_MAX_IMAGE_BYTES: ${UPLOAD_MAX_IMAGE_BYTES:?UPLOAD_MAX_IMAGE_BYTES}
      IMPORT_MAX_FILE_BYTES: ${IMPORT_MAX_FILE_BYTES:?IMPORT_MAX_FILE_BYTES}
      TZ: ${TZ:-UTC}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [internal, dokploy-network]

networks:
  internal: {}
  dokploy-network: { external: true }
