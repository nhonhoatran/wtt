name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Install gitleaks CLI (MIT)
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history for secrets
        run: ./gitleaks git --redact --exit-code 1 .

  docker-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build all images
        run: |
          docker build -f docker/api.Dockerfile --target migrate -t kamito-tt-migrate .
          docker build -f docker/api.Dockerfile --target runtime -t kamito-tt-api .
          docker build -f docker/worker.Dockerfile -t kamito-tt-worker .
          docker build -f docker/client.Dockerfile -t kamito-tt-client .
          docker build -f docker/admin.Dockerfile -t kamito-tt-admin .
      - name: Smoke admin (allowlist, routing, headers)
        run: |
          docker run -d --name admin -p 8080:8080 -e API_BASE_PATH=/api/v1 -e ADMIN_PUBLIC_URL=https://admin.test \
            -e PUBLIC_SITE_URL=https://site.test -e AUTH_SECRET=must-not-leak \
            -e UPLOAD_MAX_IMAGE_BYTES=5242880 -e IMPORT_MAX_FILE_BYTES=5242880 kamito-tt-admin
          sleep 3
          code() { curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1"; }
          test "$(code /healthz)" = 200
          test "$(code /)" = 200
          test "$(code /api/v1/public/x)" = 404
          test "$(code /api/v1/health/ready)" = 404
          curl -s http://127.0.0.1:8080/config.json | tee /dev/stderr | grep -q '"ADMIN_PUBLIC_URL":"https://admin.test"'
          ! curl -s http://127.0.0.1:8080/config.json | grep -q must-not-leak
          curl -sI http://127.0.0.1:8080/ | grep -qi '^x-frame-options: DENY'
      - name: Migrate refuses a wrong target
        run: |
          ! docker run --rm -e DATABASE_URL=postgresql://u:p@db.invalid:5432/x -e MIGRATE_CONFIRM_TARGET=other:5432/x kamito-tt-migrate

  build-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_USER: kamito
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kamito_tt_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kamito -d kamito_tt_ci_test" --health-interval 5s --health-timeout 3s --health-retries 10
      # Redis defaults to maxmemory-policy noeviction, which BullMQ requires.
      redis:
        image: redis:8.2.11-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      s3:
        image: rustfs/rustfs:1.0.4
        env:
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_ACCESS_KEY: ci-access-key
          RUSTFS_SECRET_KEY: ci-secret-key-only
          RUSTFS_VOLUMES: /data
        ports: ["9000:9000"]
    env:
      NODE_ENV: test
      APP_ENV: test
      TZ: UTC
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://kamito:ci-only-password@localhost:5432/kamito_tt_ci_test
      # e2e fixtures only run against a confirmed *_test database.
      MIGRATE_CONFIRM_TARGET: localhost:5432/kamito_tt_ci_test
      REDIS_URL: redis://localhost:6379
      QUEUE_PREFIX: kamito-tt:test
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key-only
      S3_BUCKET: kamito-tt-ci
      S3_FORCE_PATH_STYLE: "true"
      AUTH_SECRET: ci-auth-secret-0000000000000000000000
      REVALIDATE_SECRET: ci-revalidate-secret-00000000000000000
      SSR_INTERNAL_SECRET: ci-ssr-internal-secret-000000000000000
      IP_HASH_SALT: ci-ip-hash-salt-000000000000000000000000
      CLIENT_INTERNAL_URL: http://localhost:3001
      PUBLIC_SITE_URL: http://localhost:3001
      ADMIN_PUBLIC_URL: http://localhost:5173
      UPLOAD_MAX_IMAGE_BYTES: "5242880"
      UPLOAD_ALLOWED_IMAGE_TYPES: image/jpeg,image/png,image/webp
      MEDIA_IMAGE_VARIANT_WIDTHS: 320,640,1280
      IMPORT_MAX_FILE_BYTES: "5242880"
      IMPORT_MAX_UNZIPPED_BYTES: "52428800"
      IMPORT_MAX_ROWS: "5000"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24.15.0 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Create CI bucket
        env:
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key-only
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for i in $(seq 1 30); do
            aws --endpoint-url "$S3_ENDPOINT" s3api create-bucket --bucket "$S3_BUCKET" && exit 0
            sleep 2
          done
          exit 1
      - run: pnpm --filter @kamito/db exec prisma migrate deploy
      # seed:config imports the built package (dist/ is not committed).
      - run: pnpm exec turbo run build --filter=@kamito/db
      - run: pnpm --filter @kamito/db seed:config
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: No db push anywhere
        run: "! grep -rn --include=package.json 'db push' apps packages package.json"
