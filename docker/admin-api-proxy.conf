# Resolve "api" per request via Docker DNS so nginx starts even while the API container restarts.
resolver 127.0.0.11 valid=30s ipv6=off;
set $api_upstream http://api:3000;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Passes Traefik's X-Forwarded-For through unchanged (no extra hop appended); the API trusts
# TRUST_PROXY_HOPS=1. Whether Traefik overwrites client-sent XFF is verified in spike D.
proxy_set_header X-Forwarded-For $http_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_set_header X-Request-Id $request_id;
proxy_set_header Connection "";
