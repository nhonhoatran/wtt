server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Only admin and auth routes reach the API from the admin domain.
  location /api/v1/admin/ { include /etc/nginx/snippets/api-proxy.conf; }
  location /api/v1/auth/ { include /etc/nginx/snippets/api-proxy.conf; }
  location /api/ { return 404; }

  # Written at container start by admin-entrypoint.sh (html dir is read-only for the nginx user).
  location = /config.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    alias /tmp/admin-config/config.json;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
