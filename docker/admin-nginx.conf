server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # JSON bodies: must stay above JSON_BODY_LIMIT in apps/api/src/common/http/json-body-limit.ts (about 1.2 MB).
  client_max_body_size 2m;

  # Only admin, auth and public media routes reach the API from the admin domain.
  # Image uploads: limit = env UPLOAD_MAX_IMAGE_BYTES, written at container start by admin-entrypoint.sh.
  location ~ ^/api/v1/admin/media/[^/]+/content$ {
    include /etc/nginx/snippets/api-proxy.conf;
    include /tmp/admin-config/upload-limit.conf;
  }
  location /api/v1/admin/ { include /etc/nginx/snippets/api-proxy.conf; }
  location /api/v1/auth/ { include /etc/nginx/snippets/api-proxy.conf; }
  location /api/v1/media/ { include /etc/nginx/snippets/api-proxy.conf; }
  location /api/ { return 404; }

  # Written at container start by admin-entrypoint.sh (html dir is read-only for the nginx user).
  location = /config.json {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    alias /tmp/admin-config/config.json;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
