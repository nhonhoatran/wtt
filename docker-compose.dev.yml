# Local dev dependencies only (apps run on the host via `pnpm dev`).
# Host ports are configurable so they never collide with shared services already on the machine.
name: kamito-tt-dev

services:
  postgres:
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-kamito}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-kamito_tt_dev}
      TZ: UTC
    ports:
      - "127.0.0.1:${DEV_POSTGRES_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2.11-alpine
    # BullMQ requires noeviction; AOF keeps jobs across restarts.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${DEV_REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible store for dev. Apps only speak the S3 API, so this stands in for MinIO.
  s3:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${DEV_S3_ACCESS_KEY:-kamito-dev}
      RUSTFS_SECRET_KEY: ${DEV_S3_SECRET_KEY:-kamito-dev-secret}
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:${DEV_S3_PORT:-9010}:9000"
      - "127.0.0.1:${DEV_S3_CONSOLE_PORT:-9011}:9001"
    volumes:
      - s3-data:/data

  s3-init:
    image: amazon/aws-cli:2.39.3
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: ${DEV_S3_ACCESS_KEY:-kamito-dev}
      AWS_SECRET_ACCESS_KEY: ${DEV_S3_SECRET_KEY:-kamito-dev-secret}
      AWS_DEFAULT_REGION: us-east-1
      BUCKET: ${DEV_S3_BUCKET:-kamito-tt-dev}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null && exit 0
          aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$$BUCKET" && exit 0
          sleep 2
        done
        exit 1
    restart: "no"

volumes:
  pg-data:
  redis-data:
  s3-data:
